<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Friendship Café</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/cafe.css">
  <link rel="stylesheet" href="css/ui.css">
</head>
<body>
  <div id="app">
    <div class="order-popup" id="orderPopup">
      <p id="orderPopupText"></p>
    </div>
   <div class="menu-overlay hidden" id="menuOverlay">
      <div class="menu-overlay-card">
        <p class="menu-overlay-title">Place Your Order</p>
        <div class="menu-overlay-list" id="menuList"></div>
        <button class="place-order-btn" id="placeOrderBtn">Place Order</button>
      </div>
    </div>
    <div class="cafe-scene">
      <div class="table">
        <div class="table-top"></div>
        <div class="table-leg"></div>
        <div class="table-base"></div>
      </div>
      <div class="waiter" id="waiter">
        <div class="waiter-head">
          <div class="waiter-cap"></div>
        </div>
        <div class="waiter-arm"></div>
        <div class="waiter-body"></div>
        <div class="waiter-tray" id="waiterTray"></div>
      </div>
      <div class="serving-tray" id="servingTray"></div>
      <div class="menu-card" id="menuCard">
        <div class="menu-card-highlight"></div>
        <div class="menu-card-content">
          <p class="menu-card-title">Friendship Café</p>
          <div class="menu-card-divider"></div>
          <p class="menu-card-subtitle">MENU</p>
        </div>
      </div>
    </div>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
  <script>eruda.init();</script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
